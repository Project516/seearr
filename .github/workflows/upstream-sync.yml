---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Upstream Sync

# Opens a PR that merges the latest stable Seerr release into master. Files the
# fork deleted, files listed in .github/fork-owned, and a lockfile-only
# conflict are resolved automatically. A clean merge gets auto-merge armed;
# any other conflict is committed with its markers
# and left open for manual resolution. The merge bumps package.json, which
# tag-release.yml turns into a release.
#
# AUTOUPDATE_TOKEN is a PAT with the workflow scope: upstream releases touch
# .github/workflows/, which the built-in token cannot push, and PRs opened by
# the built-in token do not trigger CI.
#
# Upstream history must stay intact, so this PR is merged with a merge commit,
# never squashed.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC (00:00 CST, 01:00 CDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream stable release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.AUTOUPDATE_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Open the upstream update and arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN }}
          # gh would otherwise pick the "upstream" remote as the base repo.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          upstream="https://github.com/seerr-team/seerr.git"

          tag="$(gh api repos/seerr-team/seerr/releases/latest --jq .tag_name)"
          echo "Latest upstream stable release: $tag"

          git remote add upstream "$upstream" 2>/dev/null || git remote set-url upstream "$upstream"
          git fetch --no-tags upstream "refs/tags/${tag}:refs/upstream/${tag}"
          tagsha="$(git rev-parse "refs/upstream/${tag}^{commit}")"

          if git merge-base --is-ancestor "$tagsha" HEAD; then
            echo "master already contains ${tag}; nothing to do."
            exit 0
          fi

          branch="upstream-sync/${tag}"

          # Leave an open PR alone so a daily force-push does not overwrite a
          # manual conflict resolution. Closed PRs for the branch are ignored.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for ${tag} is already open; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge on the runner so the push is a normal branch update; pushing
          # the upstream commit directly is rejected for its workflow files.
          git checkout -B "$branch" master
          conflicts=0
          if ! git merge --no-edit -m "chore: merge upstream seerr ${tag}" "$tagsha"; then
            # Files the fork deleted stay deleted.
            git status --porcelain | awk '$1 == "DU" {print $2}' | xargs -r git rm -q --
            # Files the fork maintains itself keep the fork's version.
            grep -v '^#' .github/fork-owned | sed '/^$/d' \
              | xargs -r git diff --name-only --diff-filter=U -- \
              | xargs -r sh -c 'git checkout --ours -- "$@" && git add -- "$@"' _
            # A lockfile that is the last conflict is regenerated from the
            # merged package.json.
            if [ "$(git diff --name-only --diff-filter=U)" = "pnpm-lock.yaml" ]; then
              git checkout --theirs pnpm-lock.yaml
              pnpm install --lockfile-only --ignore-scripts
              git add pnpm-lock.yaml
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              conflicts=1
              git add -A
            fi
            git commit --no-edit
          fi
          git push --force origin "$branch"

          printf '%s\n' \
            "## Description" \
            "" \
            "Automated sync of upstream Seerr stable \`${tag}\` into \`master\`." \
            "" \
            "When the merge is clean, auto-merge is armed and GitHub merges this PR after the required checks pass. When it conflicts, the conflict markers are committed to the branch for manual resolution. Merge with a merge commit, never squash, so upstream history is kept." \
            "" \
            "## How Has This Been Tested?" \
            "" \
            "CI on this pull request." \
            "" \
            "## Checklist:" \
            "" \
            "- [x] I have read and followed the contribution guidelines." \
            > pr-body.md
          # A fresh branch can take a moment to show up in the PR API.
          pr=""
          for _ in $(seq 1 10); do
            pr="$(gh pr create \
              --base master --head "$branch" \
              --title "chore: merge upstream seerr ${tag}" \
              --body-file pr-body.md)" && break
            sleep 6
          done
          [ -n "$pr" ] || { echo "::error::Could not open the pull request for ${tag}."; exit 1; }

          if [ "$conflicts" -eq 0 ]; then
            .github/scripts/arm-automerge.sh "$pr" merge
            echo "Auto-merge armed for ${tag}."
          else
            echo "::warning::${tag} does not merge cleanly into master. The conflict markers are committed to the pull request, which has been left open for manual resolution."
          fi
